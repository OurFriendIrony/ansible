---
# ################################################################

- name: "Apt > install"
  ansible.builtin.apt:
    name: "{{ libraries_apt }}"
    state: "latest"
  register: apt_installed
  tags:
    - "terminator"

#################################################################
# Terminator 1.9.1 doesn't work with python3, so rig it for now

- name: "Apt > get version"
  when: apt_installed.changed | bool
  ansible.builtin.command: "apt list terminator | grep terminator | awk '{print $2}'"
  register: result
  tags:
    - "terminator"

- name: "Bugfix"
  when:
    - result.stdout is defined
    - result.stdout is search('1.91-1')
  ansible.builtin.lineinfile:
    path: /usr/bin/terminator
    regexp: "^#!/usr/bin/python"
    line: "#!/usr/bin/python2"
  tags:
    - "terminator"

#################################################################

- name: "Mkdir"
  ansible.builtin.file:
    path: "{{ primary_user.home }}/.config/terminator"
    state: directory
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0755"
  tags:
    - "terminator"

- name: "Copy > config"
  ansible.builtin.template:
    src: "config.j2"
    dest: "{{ primary_user.home }}/.config/terminator/config"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0644"
  tags:
    - "terminator"

#################################################################

- name: "Launcher > desktop icon"
  ansible.builtin.template:
    src: "{{ desktop }}.desktop.j2"
    dest: "/usr/share/applications/{{ desktop }}.desktop"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0644"
  tags:
    - "terminator"
    - "launcher"

- name: "Launcher > add"
  become: true
  become_user: "{{ primary_user.id }}"
  ansible.builtin.script: "../../scripts/add_{{ desktop_environment }}_launcher.sh {{ desktop }}"
  changed_when: false
  tags:
    - "terminator"
    - "launcher"

#################################################################
