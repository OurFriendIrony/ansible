---
# ################################################################

- name: "Mkdirs"
  with_items:
    - "{{ android.home }}/{{ android_version }}"
  ansible.builtin.file:
    name: "{{ item }}"
    state: "directory"
    recurse: "yes"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0755"
  tags:
    - "{{ android.tags }}"

#################################################################

- name: "Apt > install"
  ansible.builtin.apt:
    name: "{{ android.libraries.apt }}"
    state: "latest"
  tags:
    - "{{ android.tags }}"

#################################################################

- name: "Unpack"
  become: true
  become_user: "{{ primary_user.id }}"
  ansible.builtin.unarchive:
    src: "{{ android.url }}{{ android.zip }}"
    dest: "{{ android.home }}/{{ android_version }}"
    remote_src: "yes"
    creates: "{{ android.home }}/{{ android_version }}/android-studio/bin/"
  tags:
    - "{{ android.tags }}"

#################################################################

- name: "User > kvm"
  with_items:
    - "{{ all_users }}"
  ansible.builtin.user:
    name: "{{ item.id }}"
    groups: "kvm"
    append: "yes"
  tags:
    - "{{ android.tags }}"

#################################################################

- name: "Launcher > desktop icon"
  ansible.builtin.template:
    src: "{{ desktop }}.desktop.j2"
    dest: "/usr/share/applications/{{ desktop }}.desktop"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0644"
  tags:
    - "{{ android.tags }}"
    - "launcher"

- name: "Launcher > add"
  become: true
  become_user: "{{ primary_user.id }}"
  ansible.builtin.script: "../../../scripts/add_{{ desktop_environment }}_launcher.sh {{ desktop }}"
  changed_when: false
  tags:
    - "{{ android.tags }}"
    - "launcher"

#################################################################
