---
# ################################################################

- name: "Apt > install"
  when:
    - is_proxy
  ansible.builtin.apt:
    name: "{{ cntlm.libraries.apt }}"
    state: "latest"
  tags:
    - "{{ cntlm.tags }}"
    - "proxy"

- name: "Apt > install"
  when:
    - not is_proxy
  ansible.builtin.apt:
    name: "{{ cntlm.libraries.apt }}"
    state: "absent"
  tags:
    - "{{ cntlm.tags }}"
    - "proxy"

#################################################################

- name: "Cntlm > config"
  when:
    - is_proxy
  ansible.builtin.template:
    src: "cntlm.j2"
    dest: "/etc/cntlm.conf"
    owner: "{{ root_user.id }}"
    group: "{{ root_user.id }}"
  register: cntlm_config
  tags:
    - "{{ cntlm.tags }}"
    - "proxy"

- name: "Cntlm > restart"
  when:
    - is_proxy
    - cntlm_config is defined
    - cntlm_config.changed
  ansible.builtin.service:
    name: "cntlm"
    state: "restarted"
  tags:
    - "{{ cntlm.tags }}"
    - "proxy"

#################################################################

- name: "Environment > config"
  ansible.builtin.template:
    src: "environment.j2"
    dest: "/etc/environment"
    owner: "{{ root_user.id }}"
    group: "{{ root_user.id }}"
  tags:
    - "{{ cntlm.tags }}"
    - "proxy"

#################################################################

- name: "Apt > config"
  with_items:
    - { src: "apt", dest: "01proxy" }
    - { src: "apt_fix", dest: "99fixbadproxy" }
  ansible.builtin.template:
    src: "{{ item.src }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item.dest }}"
    owner: "{{ root_user.id }}"
    group: "{{ root_user.id }}"
  tags:
    - "{{ cntlm.tags }}"
    - "proxy"

#################################################################
