---
# ################################################################

- name: "Apt > install"
  ansible.builtin.apt:
    name: "{{ libraries }}"
    state: "latest"
  tags:
    - "vim"

#################################################################

- name: "Config > .vimrc"
  with_items:
    - "{{ all_users }}"
  ansible.builtin.template:
    src: "vimrc.j2"
    dest: "{{ item.home }}/.vimrc"
    owner: "{{ item.id }}"
    group: "{{ item.id }}"
    mode: "0644"
  tags:
    - "vim"

- name: "Vundle > install"
  with_items:
    - "{{ all_users }}"
  ansible.builtin.git:
    repo: "https://github.com/VundleVim/Vundle.vim.git"
    dest: "{{ item.home }}/.vim/bundle/vundle"
    update: false
  tags:
    - "vim"

- name: "Chmod > .vim"
  with_items:
    - "{{ all_users }}"
  ansible.builtin.file:
    dest: "{{ item.home }}/.vim/"
    state: directory
    recurse: true
    owner: "{{ item.id }}"
    group: "{{ item.id }}"
    mode: "0755"
  tags:
    - "vim"

#################################################################

- name: "Copy > fonts"
  when:
    - is_gui
  ansible.builtin.copy:
    src: "PowerlineSymbols.otf"
    dest: "/usr/local/share/fonts/"
    owner: "{{ root_user.id }}"
    group: "{{ root_user.id }}"
    mode: "0644"
  tags:
    - "vim"

- name: "Copy > font config"
  when:
    - is_gui
  with_items:
    - "{{ all_users }}"
  ansible.builtin.copy:
    src: "10-powerline-symbols.conf"
    dest: "{{ item.home }}/.config/fontconfig/fonts.conf/"
    owner: "{{ item.id }}"
    group: "{{ item.id }}"
    mode: "0644"
  tags:
    - vim

#################################################################
