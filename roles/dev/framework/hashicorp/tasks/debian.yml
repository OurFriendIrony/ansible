---
# ################################################################

- name: "Apt > key"
  ansible.builtin.apt_key:
    url: "{{ hashicorp.key_server }}"
    state: "present"
  tags:
    - "{{ hashicorp.tags }}"

- name: "Apt > repo"
  ansible.builtin.apt_repository:
    repo: "{{ hashicorp.repo }}"
    state: "present"
  tags:
    - "{{ hashicorp.tags }}"

- name: "Apt > install"
  with_items: "{{ hashicorp.libraries.apt }}"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: "present"
    update_cache: "yes"
  tags:
    - "{{ hashicorp.tags }}"

#################################################################
