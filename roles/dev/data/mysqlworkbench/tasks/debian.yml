---
# ################################################################

- name: "Apt > install"
  ansible.builtin.apt:
    name: "{{ mysqlworkbench.libraries.apt }}"
    state: "latest"
  tags:
    - "{{ mysqlworkbench.tags }}"

#################################################################

- name: "Apt > download and install deb"
  ansible.builtin.apt:
    deb: "{{ mysqlworkbench.url }}"
  tags:
    - "{{ mysqlworkbench.tags }}"

#################################################################

- name: "Launcher > desktop icon"
  ansible.builtin.template:
    src: "{{ desktop }}.desktop.j2"
    dest: "/usr/share/applications/{{ desktop }}.desktop"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0644"
  tags:
    - "{{ mysqlworkbench.tags }}"
    - "launcher"

- name: "Launcher > add"
  become: true
  become_user: "{{ primary_user.id }}"
  ansible.builtin.script: "../../../scripts/add_{{ desktop_environment }}_launcher.sh {{ desktop }}"
  changed_when: false
  tags:
    - "{{ mysqlworkbench.tags }}"
    - "launcher"

#################################################################
