---
# ################################################################

- name: "Mkdirs"
  with_items:
    - "{{ postman.home }}"
  ansible.builtin.file:
    name: "{{ item }}"
    state: "directory"
    recurse: "yes"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0755"
  tags:
    - "{{ postman.tags }}"

#################################################################

- name: "Apt > install"
  ansible.builtin.apt:
    name: "{{ postman.libraries.apt }}"
    state: "latest"
  tags:
    - "{{ postman.tags }}"

#################################################################

- name: "Wget"
  become: true
  become_user: "{{ primary_user.id }}"
  ansible.builtin.unarchive:
    src: "{{ postman.url }}"
    dest: "{{ postman.home }}/"
    remote_src: "yes"
    extra_opts: [--strip-components=1]
    creates: "{{ postman.home }}/Postman"
  tags:
    - "{{ postman.tags }}"

#################################################################

- name: "Launcher > desktop icon"
  ansible.builtin.template:
    src: "{{ desktop }}.desktop.j2"
    dest: "/usr/share/applications/{{ desktop }}.desktop"
    owner: "{{ primary_user.id }}"
    group: "{{ primary_user.id }}"
    mode: "0644"
  tags:
    - "{{ postman.tags }}"
    - "launcher"

- name: "Launcher > add"
  become: true
  become_user: "{{ primary_user.id }}"
  ansible.builtin.script: "../../scripts/add_{{ desktop_environment }}_launcher.sh {{ desktop }}"
  changed_when: false
  tags:
    - "{{ postman.tags }}"
    - "launcher"

#################################################################
