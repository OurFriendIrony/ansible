---
# ################################################################

- name: "Choco > install"
  with_items:
    - "{{ ssh.libraries.choco }}"
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: "present"
    package_params: '"/SSHAgentFeature"'
  tags:
    - "{{ ssh.tags }}"

#################################################################

- name: "Mkdirs"
  with_nested:
    - "{{ all_users }}"
    - "{{ ssh.dirs }}"
  ansible.windows.win_file:
    name: "{{ item[0].home }}/{{ item[1] }}"
    owner: "{{ item[0].id }}"
    group: "{{ item[0].id }}"
    mode: "0755"
    state: "directory"
  tags:
    - "{{ ssh.tags }}"

#################################################################

- name: "Config > templates"
  with_nested:
    - "{{ all_users }}"
    - "{{ ssh.templates }}"
  ansible.windows.win_template:
    src: "{{ item[1] }}.j2"
    dest: "{{ item[0].home }}/.ssh/{{ item[1] }}"
    owner: "{{ item[0].id }}"
    group: "{{ item[0].id }}"
    mode: "0664"
  tags:
    - "{{ ssh.tags }}"

#################################################################

- name: "Config > pub keys"
  with_nested:
    - "{{ all_users }}"
    - "{{ ssh_keys }}"
  ansible.windows.win_template:
    src: "pub.j2"
    dest: "{{ item[0].home }}/.ssh/{{ item[1].name }}.pub"
    owner: "{{ item[0].id }}"
    group: "{{ item[0].id }}"
    mode: "0664"
  tags:
    - "{{ ssh.tags }}"

#################################################################
